[project]
name = "travel-telemetry"
version = "0.1.0"
description = "Logger, spans, IDs de traza y eventos JSONL"
requires-python = ">=3.12"
dependencies = [
    "travel-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]

[tool.uv.sources]
travel-contracts = { workspace = true }
