[project]
name = "travel-database"
version = "0.1.0"
description = "CSV propios y vistas DuckDB de solo lectura"
requires-python = ">=3.12"
dependencies = [
    "travel-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]

[tool.uv.sources]
travel-telemetry = { workspace = true }
