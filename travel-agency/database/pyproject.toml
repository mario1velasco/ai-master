[project]
name = "travel-database"
version = "0.1.0"
description = "CSV propios y vistas DuckDB de solo lectura"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/database"]
