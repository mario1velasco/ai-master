[project]
name = "travel-contracts"
version = "0.1.0"
description = "Esquemas Pydantic compartidos (resultados y métricas)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
