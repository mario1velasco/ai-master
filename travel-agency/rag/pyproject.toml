[project]
name = "travel-rag"
version = "0.1.0"
description = "Corpus documental, conversión a Markdown y búsqueda híbrida"
requires-python = ">=3.12"
dependencies = [
    "travel-contracts",
    "travel-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.uv.sources]
travel-contracts = { workspace = true }
travel-telemetry = { workspace = true }
