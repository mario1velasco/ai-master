[project]
name = "travel-api"
version = "0.1.0"
description = "API FastAPI del agente de Viajes Nimbo"
requires-python = ">=3.12"
dependencies = [
    "travel-contracts",
    "travel-telemetry",
    "travel-agent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
travel-contracts = { workspace = true }
travel-telemetry = { workspace = true }
travel-agent = { workspace = true }
