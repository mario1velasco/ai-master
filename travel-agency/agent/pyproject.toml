[project]
name = "travel-agent"
version = "0.1.0"
description = "Agente: decide dónde buscar, combina y redacta"
requires-python = ">=3.12"
dependencies = [
    "travel-contracts",
    "travel-telemetry",
    "travel-rag",
    "travel-text2sql",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv.sources]
travel-contracts = { workspace = true }
travel-telemetry = { workspace = true }
travel-rag = { workspace = true }
travel-text2sql = { workspace = true }
