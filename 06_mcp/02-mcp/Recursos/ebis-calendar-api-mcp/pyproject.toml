[project]
name = "ebis-calendar-api-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar y gestionar el calendario EBIS"
requires-python = ">=3.11"
dependencies = ["mcp>=2.0.0,<3.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ebis_calendar_api_mcp"]
