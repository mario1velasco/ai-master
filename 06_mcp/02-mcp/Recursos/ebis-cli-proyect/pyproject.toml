[project]
name = "ebis-cli-proyect"
version = "0.1.0"
description = "EBIS-CLI: práctica 2 de integración con un servidor MCP"
requires-python = ">=3.11"
dependencies = ["openai>=1.66.0", "python-dotenv>=1.0.1", "textual>=0.80.0", "mcp>=2.0.0,<3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ebis_cli"]
