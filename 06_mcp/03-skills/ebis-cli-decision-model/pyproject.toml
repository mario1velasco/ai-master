[project]
name = "ebis-cli-decision-model"
version = "0.1.0"
description = "EBIS-CLI: agente didáctico con MCP, subagentes y Jev Decision Model"
requires-python = ">=3.11"
dependencies = ["openai>=1.66.0", "python-dotenv>=1.0.1", "textual>=0.80.0", "mcp>=2.0.0,<3.0.0", "typesafe-sdk", "tzdata>=2025.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ebis_cli"]
