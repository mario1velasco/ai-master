input_csv: data/customer_requests_structured.csv

prompt:
  role: You are a customer service automation assistant.
  task_bussines: Analyze the customer request and convert it into a structured workflow object.
  task_json: Analyze the customer request and return a JSON object that conforms exactly to the provided schema.
  instructions:
    - Do not invent missing information.
    - Use null when a value is not explicitly present.
    - Set requires_human_review to true when the request is ambiguous, incomplete or high-risk.
    - Keep suggested_action short and operational.
  output_format:
    - Return a JSON object with the following keys:
      - process_type: The main customer-service workflow triggered by the request.
      - priority: Operational priority used for queueing and SLA management.
      - order_id: Order ID only when it is explicitly present in the request.
      - reason: Short normalized reason for the request, or null if unavailable.
      - requires_human_review: True when the request is ambiguous, incomplete, high-risk or cannot be safely automated.
      - suggested_action: Short operational next action for the downstream workflow.
  
llm:
  temperature: 0.2
  max_tokens: 500
  model: claude-haiku-4-5-20251001
  timeout_seconds: 30

outputs:
  prompt_json_csv: outputs/prompt_json_results.csv
  structured_output_csv: outputs/structured_output_results.csv
  tool_call_csv: outputs/tool_call_results.csv