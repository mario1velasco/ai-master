[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-rag-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=1.70,<3", "pinecone>=7,<9", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "python-dotenv>=1,<2", "PyYAML>=6,<7", "tiktoken>=0.9,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "langchain-core>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]
